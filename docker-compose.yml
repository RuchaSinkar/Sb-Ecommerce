# ============================================================
# docker-compose.yml — Full ShopNest stack
#
# Usage:
#   1. Copy .env.example to .env and fill in real values
#   2. docker-compose up -d --build
#   3. Frontend: http://localhost
#      Backend:  http://localhost:8080
#      Postgres: localhost:5432
# ============================================================

version: '3.9'

services:

  # ───────────────────────────────────────────────────────────
  # PostgreSQL database
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopnest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sb_ecom}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopnest-net

  redis:
    image: redis:7-alpine
    container_name: shopnest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopnest-net

  # Kafka (using KRaft mode — no Zookeeper needed)
  kafka:
    image: apache/kafka:3.7.0
    container_name: shopnest-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shopnest-net

  # Kafka UI — view topics and messages in browser
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopnest-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shopnest
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - shopnest-net

   # MinIO — S3-compatible object storage for product images
  minio:
    image: minio/minio:latest
    container_name: shopnest-minio
    restart: unless-stopped
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopnest-net

  # ───────────────────────────────────────────────────────────
  # Spring Boot backend
  # ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./sb-ecom
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sb_ecom}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: shopnest-images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka: 
        condition: service_healthy
    networks:
      - shopnest-net
    deploy:
      replicas: 3

  # ───────────────────────────────────────────────────────────
  # React frontend (served via Nginx)
  # ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/ecom-frontend
      dockerfile: Dockerfile
    container_name: shopnest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - shopnest-net

networks:
  shopnest-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  product-images:
    driver: local
  redisdata:
    driver: local
  kafkadata:
    driver: local
  miniodata:
    driver: local
