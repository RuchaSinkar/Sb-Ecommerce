# ============================================================
# docker-compose.yml — Full ShopNest stack
#
# Usage:
#   1. Copy .env.example to .env and fill in real values
#   2. docker-compose up -d --build
#   3. Frontend: http://localhost
#      Backend:  http://localhost:8080
#      Postgres: localhost:5432
# ============================================================

version: '3.9'

services:

  # ───────────────────────────────────────────────────────────
  # PostgreSQL database
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopnest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sb_ecom}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopnest-net

  # ───────────────────────────────────────────────────────────
  # Spring Boot backend
  # ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./sb-ecom
      dockerfile: Dockerfile
    container_name: shopnest-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sb_ecom}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - product-images:/app/images
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopnest-net

  # ───────────────────────────────────────────────────────────
  # React frontend (served via Nginx)
  # ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/ecom-frontend
      dockerfile: Dockerfile
    container_name: shopnest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - shopnest-net

networks:
  shopnest-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  product-images:
    driver: local
