# Load balancer upstream — Docker Compose service name resolves to all instances
upstream backend_pool {
    least_conn;                    # Least connections algorithm
    server backend:8080;          # Docker resolves "backend" to all 3 instances
    keepalive 32;                 # Keep connections alive for performance
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Load balanced API calls
    location ^~ /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # Required for keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        proxy_cookie_domain backend $host;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Load balanced image requests
    location ^~ /images/ {
        proxy_pass http://backend_pool/images/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Cache static assets
    location ~* \.(js|css|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
