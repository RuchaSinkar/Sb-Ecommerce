server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip for faster loads ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ─── React SPA — serve index.html for all non-file routes ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Proxy API calls to the backend container ───────────────────────
    # "backend" is the service name from docker-compose.yml —
    # Docker's internal DNS resolves it automatically.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed for JWT cookies to pass through correctly
        proxy_cookie_path / /;
    }

    # ─── Proxy product images to the backend container ──────────────────
    location /images/ {
        proxy_pass http://backend:8080/images/;
        proxy_set_header Host $host;
    }

    # ─── Cache static assets aggressively ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}