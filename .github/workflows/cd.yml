name: CD - Deploy to VPS

# Runs after CI succeeds on main
on:
  workflow_run:
    workflows: ["CI - Build, Test & Push Images"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/shopnest

            # Pull latest images built by CI
            docker compose pull

            # Restart stack with new images, zero-downtime-ish
            docker compose up -d --remove-orphans

            # Clean up old unused images to save disk space
            docker image prune -f
